clusterGroup:
  name: hub
  isHubCluster: true

  namespaces:
    - vault
    - golang-external-secrets
    - portworx

  projects:
    - hub
    - portworx


  applications:

    vault:
      name: vault
      namespace: vault
      project: hub
      chart: hashicorp-vault
      chartVersion: 0.1.*

    golang-external-secrets:
      name: golang-external-secrets
      namespace: golang-external-secrets
      project: hub
      chart: golang-external-secrets
      chartVersion: 0.1.*


    multipath-config-mc:
      name: multipath-config-mc
      namespace: portworx
      project: portworx
      path: charts/all/multipath-config-mc
  
#  imperative: []
  
  managedClusterGroups: []
