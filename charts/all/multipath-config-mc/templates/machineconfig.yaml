{{- /*
  MachineConfig: desired multipath conf, script (files/) and systemd units (systemd.units)
*/ -}}

{{- $mergeScript := .Files.Get "files/multipath-merge.sh" | trim -}}

apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: {{ .Values.namePrefix }}
  labels:
    machineconfiguration.openshift.io/role: {{ .Values.targetRole }}
  annotations:
    argocd.argoproj.io/sync-wave: "{{ .Values.syncWave }}"
spec:
  config:
    ignition:
      version: 3.2.0
    storage:
      files:
        # canonical desired config (source of truth)
        - path: /usr/local/share/multipath.conf.desired
          mode: 0644
          overwrite: true
          contents:
            source: >
              data:text/plain;charset=utf-8;base64,{{ .Values.configContent | b64enc }}

        # install the merge script (canonical copy)
        - path: /usr/local/bin/multipath-merge.sh
          mode: 0755
          overwrite: true
          contents:
            source: >
              data:text/plain;charset=utf-8;base64,{{ $mergeScript | b64enc }}

    systemd:
      units:
        # original oneshot that merges/appends config (keeps current behavior)
        - name: multipath-merge.service
          enabled: true
          contents: |
            [Unit]
            Description=Merge multipath.conf from MachineConfig into node config
            After=network-online.target
            Wants=network-online.target

            [Service]
            Type=oneshot
            ExecStart=/usr/local/bin/multipath-merge.sh

            [Install]
            WantedBy=multi-user.target

        # ensure service (runs the same script; runs on demand / timer)
        - name: multipath-ensure.service
          enabled: false
          contents: |
            [Unit]
            Description=Ensure multipath.conf exists (copy from canonical desired)
            Wants=network-online.target
            After=network-online.target

            [Service]
            Type=oneshot
            ExecStart=/usr/local/bin/multipath-merge.sh

            [Install]
            WantedBy=multi-user.target

        # timer unit - runs the ensure.service periodically and on boot
        - name: multipath-ensure.timer
          enabled: true
          contents: |
            [Unit]
            Description=Periodic ensure of /etc/multipath.conf

            [Timer]
            OnBootSec=30s
            OnUnitActiveSec=5m
            Persistent=true

            [Install]
            WantedBy=timers.target

