# This file is only for BareMetal/VM's OCP cluster using FA/FB as cloud drive.
# Before running the file make sure you have read the pre-requisite properly, if you miss it you may run in problems

deployOperator: false                  
deployCluster: true                   

imageVersion: 3.3.1.2                   
pxOperatorImageVersion: 25.2.2         

openshiftInstall: true                 
isTargetOSCoreOS: true                
                                        
nonDisruptivek8sUpgrade: false         
skipHealthChecks: false                 


clusterName: mycluster                
usefileSystemDrive: false             
usedrivesAndPartitions: false         
drives: size=250                         
                                    
provider: pure                           

journalDevice:
cacheDevices:                         

maxStorageNodesPerZone: 0             

maxStorageNodes: 0                     

systemMetadataDevice:                


secretType: k8s                       
                                    

dataInterface: none                   
managementInterface: none             
serviceType: none                   
runtimeOptions:                      
featureGates:                         

security: 
  enabled: false                     
  auth:
    guestAccess: Enabled             
    selfSigned:                      
      tokenLifetime:                  
      issuer:                        
      sharedSecret:                  

resources:                           
  # requests:
  #   memory: "64Mi"
  #   cpu: "250m"

customMetadata:                      
                                      
  annotations:                        
    pod:
      storage: ""
    service:
      portworxApi: ""
      portworxService: ""
      portworxKVDBService: ""
  labels:                            
    service: 
      portworx-api: ""
    deployment:
      "*": ""                        
      autopilot: ""
      px-csi-ext: ""
      px-plugin: ""
      px-plugin-proxy: ""
      portworx-pvc-controller: ""
      stork: ""
      stork-scheduler: ""
      px-prometheus-operator: ""
    daemonset:         
      "*": ""                      
      portworx-api: ""
      portworx-proxy: ""
      px-telemetry-phonehome: ""
    prometheus:
      px-prometheus: ""
    alertmanager:
      portworx: ""
    pod:                           
      "*": ""
      storage: ""
      portworx-kvdb: ""


envVars: none                         

envs:                                 
    - name: PURE_FLASHARRAY_SAN_TYPE
      value: "ISCSI"

miscArgs: none                    

disableStorageClass: false            

stork:                                
  enabled: true
  storkVersion:                       
  args:                               
  volumes:                           
  env:                                

customRegistryURL:
registrySecret:
licenseSecret:

monitoring:
  prometheus:                         
    enabled: false                    
    exportMetrics: true             
    alertManager: false              

    securityContext:                 
    # Provide securityContext fields as defined by Kubernetes (https://kubernetes.io/docs/tasks/configure-pod-container/security-context/)
      # runAsNonRoot: false
      # runAsUser: 1000
  telemetry: true                    
  grafana: false                     


deployOnMaster:  false                

csi: 
  enabled: true                      
  topology: 
    enabled: false                   
  installSnapshotController: true    

autopilot: 
  enabled: true                      
  image: ""                           
  lockImage: false                    
                                      

  args:                               
  env:                                # A list of Kubernetes like environment variables passed to Autopilot
  # - name: PX_SHARED_SECRET
  #   valueFrom:
  #     secretKeyRef:
  #       key: apps-secret
  #       name: px-system-secrets
  volumes:                             # Add volumes to autopilot container. Refer the top level volumes for schema.
  providers:
  # - name: ""                          # Name is the unique name for the provider
  #   type: ""                          # Type is the type of data provider. For instance, prometheus
  #   params: ""                        # Pass params to provider. Example: url=http://datadog:9090;auth=foobar


internalKVDB: true                  
kvdbDevice: none                      
internalKvdbTls: false               
migrateToKvdbTls: false               

installCertManager: false             


kvdb:
  authSecretName: none               

volumes:                              

tolerations:                         

nodeAffinity:

nodesConfiguration:                          
 
serviceAccount:
  hook:
    create: true
    name:

clusterToken:
  create: false                                
  secretName: px-vol-encryption                
  serviceAccountName: px-create-cluster-token  


deleteStrategy:                           
  type:                                   

updateStrategy:   
  type:                                   

  # maxUnavailable and minReadySeconds applicable only on selecting type RollingUpdate
  disruption: 
    allow:                               
  maxUnavailable:                         
  minReadySeconds:                        
                                      
  autoUpdateComponents:                  
                                          
